name: Release

# A tag v<version> publishes the packages to nuget.org. The version is the one in Directory.Build.props, and the
# tag must name it. A version with a suffix (v0.3.0-rc.1) is published as a prerelease.
#
# nuget.org trusts this workflow (trusted publishing): NuGet/login trades the job's GitHub OIDC token for an API key
# that lasts an hour, so no key is stored. The policy on nuget.org names this file (release.yml) and the
# environment `nuget`; NUGET_USER is the nuget.org account the policy belongs to.
#
# Fadenstack.Agents.Delegation goes to the fadenstack organisation's GitHub Packages feed instead, where the A2A fork it
# needs is (upstream A2A has no netstandard2.0 build yet: a2aproject/a2a-dotnet issue #197; sdk/08 decision 11). The
# job's GITHUB_TOKEN reads A2A and writes the delegation package: the A2A package must give this repository read access
# (its package settings, "Manage Actions access").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Windows: the released Fadenstack.UI.Wpf (net472, net8.0-windows) is built on the platform it runs on.
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: The tag names the version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not match the version $version in Directory.Build.props."
          }

      # A2A only from the fadenstack feed, everything else only from nuget.org: no package can come from the other source
      # (dependency confusion). NuGet reads the token from the environment of the step that restores.
      - name: Package sources
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="fadenstack" value="https://nuget.pkg.github.com/fadenstack/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
              <packageSource key="fadenstack">
                <package pattern="A2A" />
              </packageSource>
            </packageSourceMapping>
            <packageSourceCredentials>
              <fadenstack>
                <add key="Username" value="github-actions" />
                <add key="ClearTextPassword" value="%GITHUB_TOKEN%" />
              </fadenstack>
            </packageSourceCredentials>
          </configuration>
          '@ | Set-Content -Path nuget.config -Encoding utf8NoBOM

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet test Fadenstack.slnx -c Release

      - name: Pack
        run: dotnet pack Fadenstack.slnx -c Release --no-build -o artifacts

      # The delegation package goes to the fadenstack feed, not to nuget.org (see the top of this file).
      - name: Set the delegation package apart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force private | Out-Null
          $delegation = Get-ChildItem artifacts -Filter 'Fadenstack.Agents.Delegation.*'
          if (-not ($delegation | Where-Object Extension -eq '.nupkg')) { throw "No delegation package in artifacts." }
          $delegation | Move-Item -Destination private

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/
            private/

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes each .nupkg and the .snupkg next to it, one file at a time: on Windows, dotnet nuget push does not
      # expand "artifacts/*.nupkg". --skip-duplicate lets a rerun finish a release that stopped half-way; a version
      # already on nuget.org can never be replaced.
      - name: Publish
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg
          if (-not $packages) { throw "No packages in artifacts." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($package.Name) failed." }
          }

      # After nuget.org: the delegation package depends on Fadenstack.Agents of the same version. GitHub Packages takes no
      # symbol packages. --skip-duplicate, as above, lets a rerun finish.
      - name: Publish the delegation package to the fadenstack feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($package in Get-ChildItem private -Filter *.nupkg) {
            dotnet nuget push $package.FullName --api-key $env:GITHUB_TOKEN --no-symbols `
              --source https://nuget.pkg.github.com/fadenstack/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($package.Name) failed." }
          }
