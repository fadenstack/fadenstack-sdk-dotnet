name: Release

# A tag v<version> publishes the packages to nuget.org. The version is the one in Directory.Build.props, and the
# tag must name it. A version with a suffix (v0.3.0-rc.1) is published as a prerelease.
#
# The jobs, in order:
#   build           tests on Windows, packs the packages and keeps them as the run's artifacts: `packages` (nuget.org's in
#                   artifacts/, the delegation package in private/) and `release-files` (every .nupkg in one flat folder).
#   github-release  a GitHub release for the tag, holding the packages as built here.
#   supply-chain    core's shared release workflow (fadenstack/fadenstack, pinned by commit): an SBOM per package to BSI
#                   TR-03183-2, the OSV scan with OpenVEX and CSAF (.vex/openvex.json holds this repository's statements),
#                   the OpenSSF Scorecard, keyless cosign signatures and GitHub's attestations, all added to the release.
#   publish         nuget.org and the fadenstack feed, only after the supply chain passed: a high-severity finding
#                   without a VEX statement stops the release before anything is published (CRA Annex I part II).
# nuget.org adds its own repository signature to each package, so the file there differs from the one on the release;
# the signatures and attestations verify the release's file.
#
# Run by hand (workflow_dispatch) it is a dry run: build and the supply chain's SBOMs, scan and Scorecard only, shown in
# the run's summary; nothing is signed, uploaded or published.
#
# nuget.org trusts this workflow (trusted publishing): NuGet/login trades the job's GitHub OIDC token for an API key
# that lasts an hour, so no key is stored. The policy on nuget.org names this file (release.yml) and the
# environment `nuget`; NUGET_USER is the nuget.org account the policy belongs to.
#
# Fadenstack.Agents.Delegation goes to the fadenstack organisation's GitHub Packages feed instead, where the A2A fork it
# needs is (upstream A2A has no netstandard2.0 build yet: a2aproject/a2a-dotnet issue #197; sdk/08 decision 11). The
# job's GITHUB_TOKEN reads A2A and writes the delegation package: the A2A package must give this repository read access
# (its package settings, "Manage Actions access").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Windows: the released Fadenstack.UI.Wpf (net472, net8.0-windows) is built on the platform it runs on.
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read # A2A from the fadenstack feed
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: The version (a tag names it)
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not match the version $version in Directory.Build.props."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # A2A only from the fadenstack feed, everything else only from nuget.org: no package can come from the other source
      # (dependency confusion). NuGet reads the token from the environment of the step that restores.
      - name: Package sources
        shell: pwsh
        run: |
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="fadenstack" value="https://nuget.pkg.github.com/fadenstack/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
              <packageSource key="fadenstack">
                <package pattern="A2A" />
              </packageSource>
            </packageSourceMapping>
            <packageSourceCredentials>
              <fadenstack>
                <add key="Username" value="github-actions" />
                <add key="ClearTextPassword" value="%GITHUB_TOKEN%" />
              </fadenstack>
            </packageSourceCredentials>
          </configuration>
          '@ | Set-Content -Path nuget.config -Encoding utf8NoBOM

      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet test Fadenstack.slnx -c Release

      # The injection suite runs inside the test step above too; this step names it, so a failure says what broke. It never
      # needs a network or a model: injected content runs through every untrusted channel against the fake gateway.
      - name: Injection suite (sdk/51 7.1)
        run: dotnet test Fadenstack.slnx -c Release --no-build --filter "Category=Injection"

      - name: Pack
        run: dotnet pack Fadenstack.slnx -c Release --no-build -o artifacts

      # The delegation package goes to the fadenstack feed, not to nuget.org (see the top of this file).
      - name: Set the delegation package apart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force private | Out-Null
          $delegation = Get-ChildItem artifacts -Filter 'Fadenstack.Agents.Delegation.*'
          if (-not ($delegation | Where-Object Extension -eq '.nupkg')) { throw "No delegation package in artifacts." }
          $delegation | Move-Item -Destination private

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/
            private/

      # The release files, every .nupkg in one flat folder (the delegation package beside the others): what the GitHub release
      # holds and the shared supply chain covers.
      - name: Gather the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          Copy-Item artifacts/*.nupkg, private/*.nupkg -Destination release-files
          if (-not (Get-ChildItem release-files -Filter *.nupkg)) { throw "No packages to release." }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: packages

      # A rerun finds the release already made and replaces its packages with this run's.
      - name: Create the release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -type f -name '*.nupkg' | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No packages in the artifact"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
            --title "Fadenstack .NET SDK $VERSION" \
            --notes "The packages of this release as its workflow built them; nuget.org serves the same packages with its own repository signature added. What changed is in CHANGELOG.md. The supply-chain job adds an SBOM per package (CycloneDX, BSI TR-03183-2), the vulnerability report (OpenVEX, CSAF), cosign signatures and the build provenance." \
            "${files[@]}"

  supply-chain:
    needs: [build, github-release]
    # On a tag after the GitHub release; run by hand, a dry run without one.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.github-release.result == 'success' || (github.ref_type != 'tag' && needs.github-release.result == 'skipped')) }}
    # The called workflow asks for more than read on its publish job, and a caller must grant that ceiling or the run does
    # not start. A dry run never uses the write grants: that job is skipped. No secrets are passed: keyless signing in a
    # public repository needs none.
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
      actions: read
    uses: fadenstack/fadenstack/.github/workflows/release-supply-chain.yml@f7c915a32ad64f725be51b3154484bfc81fbbec1
    with:
      product: fadenstack-sdk-dotnet
      version: ${{ needs.build.outputs.version }}
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      supplier_name: Emagin8 UG (haftungsbeschränkt)
      supplier_url: https://fadenstack.com
      licence: Apache-2.0
      files_artifact: release-files
      files: "*.nupkg"
      signing: keyless
      attest: true
      dry_run: ${{ github.ref_type != 'tag' }}
      tools_ref: f7c915a32ad64f725be51b3154484bfc81fbbec1

  publish:
    if: github.ref_type == 'tag'
    needs: [build, supply-chain]
    runs-on: windows-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # trusted publishing on nuget.org
      packages: write # the delegation package on the fadenstack feed
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The artifact holds artifacts/ (for nuget.org) and private/ (the delegation package), as the build job left them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: .

      - name: Sign in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes each .nupkg and the .snupkg next to it, one file at a time: on Windows, dotnet nuget push does not
      # expand "artifacts/*.nupkg". --skip-duplicate lets a rerun finish a release that stopped half-way; a version
      # already on nuget.org can never be replaced.
      - name: Publish
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg
          if (-not $packages) { throw "No packages in artifacts." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($package.Name) failed." }
          }

      # After nuget.org: the delegation package depends on Fadenstack.Agents of the same version. GitHub Packages takes no
      # symbol packages. --skip-duplicate, as above, lets a rerun finish.
      - name: Publish the delegation package to the fadenstack feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = Get-ChildItem private -Filter *.nupkg
          if (-not $packages) { throw "No delegation package in private." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:GITHUB_TOKEN --no-symbols `
              --source https://nuget.pkg.github.com/fadenstack/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Pushing $($package.Name) failed." }
          }
