name: Feature request
description: Propose a change or a new feature. Please open one before you write code.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the solution you have in mind. We reply whether it fits and how we would like it done,
        so your work is not wasted.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to make this change myself, once we have agreed on the approach.
